name: Publish NPM Package

on:
  release:
    types: [published]
  pull_request_target:
    types: [closed]
    branches: [main] # only run on PRs targeting main
  workflow_dispatch:

jobs:
  npm:
    # Only run on merged PRs or releases
    if: github.event_name == 'release' || (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    name: Publish to NPM
    permissions:
      contents: read
      id-token: write # required for OIDC to NPM
      pull-requests: read # needed for pull_request_target
    environment: NPM # remove this line if you don't use env protection rules

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # For pull_request_target, this checks out the base branch, not the PR branch
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build package
        run: |
          npm ci
          npm run build
          npm pack # creates the.tgz file

      - name: Publish to NPM with OIDC
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          NPM_TOKEN=$(curl -s -X POST https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/%40billwarden%2Fcli \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -d "{\"oidcToken\":\"$OIDC_TOKEN\"}" | jq -r.token)

          npm config set //registry.npmjs.org/:_authToken=$NPM_TOKEN

          # Find the generated tgz file
          PKG=$(ls billwarden-cli-*.tgz)
          npm publish $PKG --access public
